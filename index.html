<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>رافع الفيديوهات السريع | B2 Stream</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <!-- مكتبة AWS S3 الرسمية للرفع المباشر عبر أجزاء متوازية لسرعة قصوى -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/aws-sdk/2.1585.0/aws-sdk.min.js"></script>

  <style>
    :root {
      --bg-1: #020617;
      --accent: #8b5cf6;
      --accent-hover: #a855f7;
      --card-bg: rgba(15, 23, 42, 0.85);
      --border: rgba(255, 255, 255, 0.1);
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }

    body {
      background: radial-gradient(circle at top, #1e1b4b, var(--bg-1));
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .container {
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 24px;
      width: 100%;
      max-width: 480px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.6);
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .header { text-align: center; }
    .header h2 { font-size: 1.4rem; font-weight: 800; color: #fff; margin-bottom: 4px; }
    .header p { font-size: 0.85rem; color: var(--text-muted); }

    .drop-zone {
      border: 2px dashed rgba(139, 92, 246, 0.5);
      border-radius: 18px;
      padding: 35px 15px;
      text-align: center;
      cursor: pointer;
      transition: 0.3s;
      background: rgba(0,0,0,0.3);
    }
    .drop-zone:hover {
      border-color: var(--accent);
      background: rgba(139, 92, 246, 0.15);
      transform: scale(1.01);
    }
    .drop-zone i { font-size: 3rem; color: var(--accent); margin-bottom: 12px; }
    .drop-zone h3 { font-size: 1.05rem; margin-bottom: 4px; }
    .drop-zone span { font-size: 0.8rem; color: var(--text-muted); }

    .file-info {
      display: none;
      background: rgba(0,0,0,0.4);
      padding: 14px;
      border-radius: 16px;
      border: 1px solid var(--border);
      font-size: 0.85rem;
    }
    .progress-bar-wrap {
      width: 100%;
      height: 10px;
      background: rgba(255,255,255,0.1);
      border-radius: 8px;
      overflow: hidden;
      margin-top: 10px;
    }
    .progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #8b5cf6, #d946ef);
      transition: width 0.2s ease;
    }

    button.btn {
      background: linear-gradient(135deg, #8b5cf6 0%, #d946ef 100%);
      border: none;
      color: #fff;
      padding: 14px 20px;
      border-radius: 14px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 1rem;
      transition: 0.3s;
      box-shadow: 0 4px 15px rgba(139, 92, 246, 0.3);
    }
    button.btn:hover { filter: brightness(1.1); transform: translateY(-2px); }
    button.btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; box-shadow: none; }

    .result-box {
      display: none;
      background: rgba(16, 185, 129, 0.12);
      border: 1px solid rgba(16, 185, 129, 0.4);
      border-radius: 16px;
      padding: 16px;
      flex-direction: column;
      gap: 10px;
    }
    .result-box span { color: #10b981; font-weight: 800; font-size: 0.9rem; }
    .result-input-group { display: flex; gap: 8px; }
    .result-input-group input {
      flex: 1;
      background: rgba(0,0,0,0.6);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: #fff;
      padding: 10px 12px;
      font-size: 0.85rem;
      direction: ltr;
      outline: none;
    }
    .btn-copy {
      background: #10b981;
      border: none;
      color: #fff;
      padding: 10px 16px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 0.85rem;
      cursor: pointer;
      transition: 0.2s;
    }
    .btn-copy:hover { filter: brightness(1.1); }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h2><i class="fa-solid fa-cloud-arrow-up" style="color:var(--accent); margin-left: 6px;"></i> رافع الفيديوهات المباشر</h2>
      <p>ارفع فيديوهاتك (حتى 2GB) واحصل على رابط بث فائق السرعة لموقعك</p>
    </div>

    <!-- منطقة اختيار الفيديو -->
    <div class="drop-zone" id="dropZone" onclick="document.getElementById('videoFile').click()">
      <i class="fa-solid fa-file-video"></i>
      <h3>اضغط لاختيار فيديو من الاستوديو</h3>
      <span>يدعم MP4, MKV, WebM بأي حجم</span>
      <input type="file" id="videoFile" accept="video/*" style="display:none" onchange="onFileSelected(this.files[0])">
    </div>

    <!-- كارت حالة الملف وشريط التقدم -->
    <div class="file-info" id="fileInfo">
      <div style="display:flex; justify-content:space-between;">
        <span id="fileName" style="font-weight:bold; max-width:70%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">-</span>
        <span id="fileSize" style="color:var(--text-muted);">-</span>
      </div>
      <div class="progress-bar-wrap">
        <div class="progress-bar" id="progressBar"></div>
      </div>
      <div style="display:flex; justify-content:space-between; margin-top:6px; font-size:0.75rem; color:var(--text-muted);">
        <span id="uploadPercent">0%</span>
        <span id="uploadSpeed">-</span>
      </div>
    </div>

    <button class="btn" id="uploadBtn" onclick="startUpload()" disabled>
      <i class="fa-solid fa-bolt"></i> بدء الرفع السريع
    </button>

    <!-- صندوق النتيجة بعد اكتمال الرفع -->
    <div class="result-box" id="resultBox">
      <span><i class="fa-solid fa-circle-check"></i> تم رفع الفيديو بنجاح!</span>
      <div class="result-input-group">
        <input type="text" id="streamUrl" readonly>
        <button class="btn-copy" onclick="copyStreamUrl()"><i class="fa-regular fa-copy"></i> نسخ</button>
      </div>
    </div>
  </div>

  <script>
    // ⚙️ البيانات الخاصة بمستودعك (تم حقنها وتفعيلها بالكامل)
    const B2_CONFIG = {
      endpoint: "s3.eu-central-003.backblazeb2.com",
      region: "eu-central-003",
      bucketName: "Withsomy1436",
      keyId: "003b9989b651dde0000000002",
      applicationKey: "K003NEBgrB3s/Z7RgcXbWul0FFEA+cl"
    };

    let selectedFile = null;
    let uploadStartTime = null;

    function onFileSelected(file) {
      if (!file) return;
      selectedFile = file;
      document.getElementById('fileName').innerText = file.name;
      document.getElementById('fileSize').innerText = (file.size / (1024 * 1024)).toFixed(1) + ' MB';
      document.getElementById('fileInfo').style.display = 'block';
      document.getElementById('uploadBtn').disabled = false;
      document.getElementById('progressBar').style.width = '0%';
      document.getElementById('uploadPercent').innerText = '0%';
      document.getElementById('resultBox').style.display = 'none';
    }

    function startUpload() {
      const uploadBtn = document.getElementById('uploadBtn');
      uploadBtn.disabled = true;
      uploadBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> جاري الرفع...';

      // تهيئة S3 Client لـ Backblaze B2
      const s3 = new AWS.S3({
        endpoint: new AWS.Endpoint(B2_CONFIG.endpoint),
        accessKeyId: B2_CONFIG.keyId,
        secretAccessKey: B2_CONFIG.applicationKey,
        region: B2_CONFIG.region,
        s3ForcePathStyle: true,
        signatureVersion: 'v4'
      });

      // تنظيف اسم الملف لتفادي أي مشاكل في ترميز الروابط
      const cleanName = Date.now() + '_' + selectedFile.name.replace(/[^a-zA-Z0-9._-]/g, '_');

      const params = {
        Bucket: B2_CONFIG.bucketName,
        Key: cleanName,
        Body: selectedFile,
        ContentType: selectedFile.type || 'video/mp4'
      };

      uploadStartTime = Date.now();

      // رفع الملف كأجزاء متوازية بحجم 10MB لكل جزء لسرعة فائقة
      const managedUpload = s3.upload(params, { partSize: 10 * 1024 * 1024, queueSize: 4 });

      managedUpload.on('httpUploadProgress', (evt) => {
        const percent = Math.round((evt.loaded / evt.total) * 100);
        document.getElementById('progressBar').style.width = percent + '%';
        document.getElementById('uploadPercent').innerText = percent + '%';

        const elapsed = (Date.now() - uploadStartTime) / 1000;
        if (elapsed > 0) {
          const speedMB = ((evt.loaded / (1024 * 1024)) / elapsed).toFixed(1);
          document.getElementById('uploadSpeed').innerText = `${speedMB} MB/s`;
        }
      });

      managedUpload.send((err, data) => {
        uploadBtn.disabled = false;
        uploadBtn.innerHTML = '<i class="fa-solid fa-bolt"></i> بدء الرفع السريع';

        if (err) {
          console.error(err);
          alert('حدث خطأ أثناء الرفع: ' + err.message);
          return;
        }

        // صيغة الرابط المباشر للبث في مشغل Video.js
        const finalStreamUrl = `https://${B2_CONFIG.bucketName}.${B2_CONFIG.endpoint}/${cleanName}`;
        
        document.getElementById('streamUrl').value = finalStreamUrl;
        document.getElementById('resultBox').style.display = 'flex';
      });
    }

    function copyStreamUrl() {
      const copyText = document.getElementById('streamUrl');
      copyText.select();
      copyText.setSelectionRange(0, 99999);
      navigator.clipboard.writeText(copyText.value);
      alert('تم نسخ الرابط! الصقه الآن في موقع المشاهدة المتزامنة 🎬');
    }
  </script>
</body>
</html>
